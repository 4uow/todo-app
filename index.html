<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Todo app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body class="dark">

  <picture id="dark-bg">
    <source media="(max-width: 600px)" srcset="./images/bg-mobile-dark.jpg">
    <img src="./images/bg-desktop-dark.jpg" alt="" class="bg-image" >
  </picture>

  <picture id="light-bg" hidden>
    <source media="(max-width: 600px)" srcset="./images/bg-mobile-light.jpg">
    <img src="./images/bg-desktop-light.jpg" alt="" class="bg-image">
  </picture>


  <main>
    <div class="header">
      <h1>TODO</h1>
      <button id="turn-to-dark" class="theme-toggle" aria-label="turn to dark theme" hidden>
        <img src="./images/icon-moon.svg" alt="moon icon" class="moon-icon">
      </button>
      <button id="turn-to-light" class="theme-toggle" aria-label="turn to light theme">
        <img src="./images/icon-sun.svg" alt="sun icon" class="sun-icon" >
      </button>
    </div>

    <div class ="input-area dark">
        <button class="decorative-button" aria-label="Mark all todos as completed">
        </button>
        <input type="text"  id="new-todo" class="textcontent" placeholder="Create a new todo..." aria-label="Create a new todo">
    </div>

    <div class="todo-list dark">
      <!-- <div class="todo-item dark">
        <button class="todo-item-completed-button" aria-label="Mark as completed">
          <img src="./images/icon-check.svg" alt="check icon" class="todo-item-completed-icon" hidden>
        </button>
        <span class="todo-text dark">Buy groceries</span>
        <button class="todo-item-delete-button" aria-label="Delete">
          <img src="./images/icon-cross.svg" alt="cross icon" class="todo-item-delete-icon">
        </button> -->
      </div>
    </div>

    <div class="control-area dark">
      <span id="residual-items"><!-- Add dynamic number --> items left</span>
      

      <button class="control-button dark" id="clear-completed" aria-label="Clear completed todos">Clear Completed</button>
      </div>
  </main>

  <div class ="filter-buttons dark">
        <label for="all">
          <input type="radio" name="filter" id ="all" class ="control-button dark" aria-label ="View all todos" checked></input>
          <span class="control-button-text dark">All</span>
        </label>
        <label for="active">
          <input type="radio" name="filter" id ="active" class ="control-button dark" aria-label ="View active todos"></input>
          <span class="control-button-text dark">Active</span>
        </label>
        <label for="completed">
          <input type="radio" name="filter" id ="completed" class ="control-button dark" aria-label ="View completed todos"></input>
          <span class="control-button-text dark">Completed</span>
        </label>
  </div>

  <footer class="tip">Drag and drop to reorder list</footer>

  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
