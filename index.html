<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Todo app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->

  <link rel="stylesheet" href="./style.css">
</head>
<body class="light">
  <img src="./images/bg-desktop-dark.jpg" alt="" class="bg-image" hidden>
  <img src="./images/bg-desktop-light.jpg" alt="" class="bg-image">

  <main>
    <div class="header">
      <h1>TODO</h1>
      <button id="turn-to-dark" class="theme-toggle" aria-label="turn to dark theme">
        <img src="./images/icon-moon.svg" alt="moon icon" class="moon-icon">
      </button>
      <button id="turn-to-light" class="theme-toggle" aria-label="turn to light theme" hidden>
        <img src="./images/icon-sun.svg" alt="sun icon" class="sun-icon" >
      </button>
    </div>

    <div class ="input-area light">
        <button class="decorative-button" aria-label="Mark all todos as completed">
        </button>
        <input type="text"  class="textcontent" placeholder="Create a new todo..."id="new-todo" aria-label="Create a new todo">
    </div>

    <div class="todo-list light"></div>

    <div class="control-area light">
      <span><!-- Add dynamic number --> items left</span>
      <div class ="filter-buttons">
        <button id ="all" class ="control-button light" aria-label ="View all todos">All</button>
        <button id ="active" class ="control-button light" aria-label ="View active todos">Active</button>
        <button id ="completed" class ="control-button light" aria-label ="View completed todos">Completed</button>
      </div>
      <button class="control-button light" aria-label="Clear completed todos">Clear Completed</button>
      </div>
  </main>

  <footer class="tip">Drag and drop to reorder list</footer>

  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
